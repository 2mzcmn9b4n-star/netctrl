name: Build NetCtrl EXE

on:
  push:
    branches:
      - main
    paths:
      - 'rust_engine/**'
      - '*.py'
      - 'build_exe.bat'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Npcap and SDK
        run: |
          # Download and install Npcap runtime
          $npcapUrl = "https://npcap.com/dist/npcap-1.80.exe"
          $npcapInstaller = "$env:TEMP\npcap-installer.exe"
          
          Write-Host "Downloading Npcap runtime..."
          Invoke-WebRequest -Uri $npcapUrl -OutFile $npcapInstaller -ErrorAction Stop
          
          Write-Host "Installing Npcap..."
          & $npcapInstaller /S /npf_startup=yes /admin=yes
          Start-Sleep -Seconds 10
          
          # Download Npcap SDK from GitHub releases (more reliable)
          $sdkUrl = "https://github.com/nmap/npcap/releases/download/v1.80/npcap-sdk-1.16.zip"
          $sdkZip = "$env:TEMP\npcap-sdk.zip"
          $sdkPath = "C:\npcap-sdk"
          
          Write-Host "Downloading Npcap SDK from GitHub..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip -ErrorAction Stop
          
          Write-Host "Extracting Npcap SDK..."
          Expand-Archive -Path $sdkZip -DestinationPath $sdkPath -Force
          
          # Set environment variables for linking
          Write-Host "Setting environment variables..."
          $libPath = "$sdkPath\Lib\x64"
          Add-Content -Path $env:GITHUB_ENV -Value "NPCAP_SDK=$sdkPath"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$libPath"
          
          Write-Host "Npcap setup completed"
          Write-Host "SDK Path: $sdkPath"
          Write-Host "LIB Path: $libPath"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install scapy psutil requests customtkinter
          pip install pyinstaller

      - name: Build Rust engine
        shell: cmd
        run: |
          cd rust_engine
          cargo build --release
          if errorlevel 1 exit /b 1
          copy /Y target\release\rust_engine.exe ..\rust_engine.exe
          cd ..
        env:
          NPCAP_SDK: C:\npcap-sdk
          LIB: C:\npcap-sdk\Lib\x64

      - name: Build Python EXE with PyInstaller
        run: |
          pyinstaller --oneline --noconsole --uac-admin `
            --add-data "rust_engine.exe;." `
            --add-data "device_names.json;." `
            --name "NetCtrl" `
            main.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/NetCtrl.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetCtrl-Build
          path: dist/NetCtrl.exe
          retention-days: 30
