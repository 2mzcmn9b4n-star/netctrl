name: Build NetCtrl EXE

on:
  push:
    branches:
      - main
    paths:
      - 'rust_engine/**'
      - '*.py'
      - 'build_exe.bat'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Npcap
        run: |
          $npcapUrl = "https://npcap.com/dist/npcap-1.79.exe"
          $npcapInstaller = "npcap-installer.exe"
          
          Write-Host "Downloading Npcap..."
          Invoke-WebRequest -Uri $npcapUrl -OutFile $npcapInstaller -ErrorAction Stop
          
          Write-Host "Installing Npcap..."
          & ".\$npcapInstaller" /S /npf_startup=yes /admin=yes
          
          Start-Sleep -Seconds 10
          Write-Host "Npcap installation completed"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install scapy psutil requests customtkinter
          pip install pyinstaller

      - name: Build Rust engine
        run: |
          cd rust_engine
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item -Path target\release\rust_engine.exe -Destination ..\rust_engine.exe -Force
          cd ..

      - name: Build Python EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --uac-admin `
            --add-data "rust_engine.exe;." `
            --add-data "device_names.json;." `
            --name "NetCtrl" `
            main.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/NetCtrl.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetCtrl-Build
          path: dist/NetCtrl.exe
          retention-days: 30
