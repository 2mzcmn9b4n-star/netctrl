name: Build NetCtrl EXE

on:
  push:
    branches:
      - main
    paths:
      - 'rust_engine/**'
      - '*.py'
      - 'build_exe.bat'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Npcap SDK using vcpkg
        run: |
          # Use vcpkg to install npcap SDK reliably
          vcpkg install npcap:x64-windows
          
          # Get the vcpkg path
          $vcpkgPath = "$env:VCPKG_INSTALLATION_ROOT"
          $sdkPath = "$vcpkgPath\packages\npcap_x64-windows"
          
          Write-Host "SDK installed at: $sdkPath"
          
          # Set environment variables
          Add-Content -Path $env:GITHUB_ENV -Value "NPCAP_SDK=$sdkPath"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$sdkPath\lib"
          
          Write-Host "Environment variables set"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install scapy psutil requests customtkinter
          pip install pyinstaller

      - name: Build Rust engine
        shell: cmd
        run: |
          cd rust_engine
          cargo build --release
          if errorlevel 1 exit /b 1
          copy /Y target\release\rust_engine.exe ..\rust_engine.exe
          cd ..
        env:
          NPCAP_SDK: ${{ env.NPCAP_SDK }}
          LIB: ${{ env.LIB }}

      - name: Build Python EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --uac-admin `
            --add-data "rust_engine.exe;." `
            --add-data "device_names.json;." `
            --name "NetCtrl" `
            main.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/NetCtrl.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetCtrl-Build
          path: dist/NetCtrl.exe
          retention-days: 30
