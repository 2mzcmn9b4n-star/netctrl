name: Build EXE (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install Python dependencies (if requirements.txt exists)
        if: ${{ always() }}
        run: |
          if exist requirements.txt (
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          ) else (
            echo "requirements.txt not found, skipping pip install."
          )
        shell: cmd

      - name: Show environment versions
        run: |
          python --version
          rustc --version
        shell: bash

      - name: Run build script (buildexe.bat)
        run: |
          if exist buildexe.bat (
            echo "Running buildexe.bat..."
            buildexe.bat
          ) else (
            echo "ERROR: buildexe.bat not found in repository root."
            echo "If your build script is elsewhere, update this workflow to run the correct script or command."
            exit 1
          )
        shell: cmd

      - name: Collect EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netctrl-exe
          path: |
            **\*.exe
            dist\**\*.exe
