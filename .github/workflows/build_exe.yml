name: Build NetCtrl EXE

on:
  push:
    branches:
      - main
    paths:
      - 'rust_engine/**'
      - '*.py'
      - 'build_exe.bat'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Npcap and SDK
        run: |
          # Download and install Npcap runtime
          $npcapUrl = "https://npcap.com/dist/npcap-1.79.exe"
          $npcapInstaller = "$env:TEMP\npcap-installer.exe"
          
          Write-Host "Downloading Npcap runtime..."
          Invoke-WebRequest -Uri $npcapUrl -OutFile $npcapInstaller -ErrorAction Stop
          
          Write-Host "Installing Npcap..."
          & $npcapInstaller /S /npf_startup=yes /admin=yes
          Start-Sleep -Seconds 5
          
          # Download and install Npcap SDK
          $sdkUrl = "https://npcap.com/dist/npcap-sdk-1.14.zip"
          $sdkZip = "$env:TEMP\npcap-sdk.zip"
          $sdkPath = "C:\npcap-sdk"
          
          Write-Host "Downloading Npcap SDK..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip -ErrorAction Stop
          
          Write-Host "Extracting Npcap SDK..."
          Expand-Archive -Path $sdkZip -DestinationPath $sdkPath -Force
          
          # Set environment variables for linking
          Write-Host "NPCAP_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "LIB=$sdkPath\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          Write-Host "Npcap setup completed"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install scapy psutil requests customtkinter
          pip install pyinstaller

      - name: Build Rust engine
        run: |
          cd rust_engine
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item -Path target\release\rust_engine.exe -Destination ..\rust_engine.exe -Force
          cd ..
        env:
          NPCAP_SDK: C:\npcap-sdk
          LIB: C:\npcap-sdk\Lib\x64;${{ env.LIB }}

      - name: Build Python EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --uac-admin `
            --add-data "rust_engine.exe;." `
            --add-data "device_names.json;." `
            --name "NetCtrl" `
            main.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/NetCtrl.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetCtrl-Build
          path: dist/NetCtrl.exe
          retention-days: 30
